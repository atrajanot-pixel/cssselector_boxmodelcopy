<!DOCTYPE html>
<html lang="pt-BR">

</head>
<body>

    <header class="cabecalho-site">
        <h1>Área do Aluno</h1>
        <nav>

    <main>

        <section id="cartao-estudante">

            <h2>Calouro Tech UniDiasUp</h2>

            <p class="texto-bio">Apaixonado por tecnologia, café e resolver bugs (ou criar alguns novos).</p>
            <p class="texto-bio">Focado em dominar o Front-End!</p>

            <!-- Botões usam classes para padronização -->
            <a href="#" class="botao-contato">Meu GitHub</a>
            <a href="#" class="botao-contato">Meu LinkedIn</a>

        </section>
    </main>

    <!-- TAREFA 3: Substitua "[SEU NOME AQUI]" pelo seu nome completo -->
    <footer>
        <p>&copy; 2026 Tech UniDiasUp - Desenvolvido por: [SEU NOME AQUI]</p>
